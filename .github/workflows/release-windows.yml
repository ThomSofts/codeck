# Release do Codeck para Windows (o Mac sai do Mac: scripts/release-macos.sh).
#
# CUSTO ZERO: a cota gratuita do Actions conta o Windows em dobro e o macOS dez vezes. Por isso este workflow só
# roda quando a VERSÃO muda (arquivo VERSION, `x.y.z+N`). Versão nova = subir o `+N`.
#
# A cada versão:
#   1. Windows: o app (C# + WebView2), o Python embutido, o backend e o runtime do Visual C++, empacotados pelo
#      ThomSoft Setup — o mesmo instalador do Chefinho: instala no perfil do usuário (sem administrador),
#      atualiza por cima com o app aberto (`--update --wait-pid`) e desinstala limpo. Antes de sair, o instalador
#      é EXECUTADO no runner: instala sem janela, abre o app, atualiza por cima e desinstala.
#   2. Publica no site da ThomSoft (downloads/codeck/) e atualiza a parte do Windows no latest.json que o app
#      instalado consulta. A parte do Mac fica como o script local a deixou. Uma cópia vai para o GitHub Releases.
#
# Nenhum segredo vai para o instalador: o PAT de cada dev é cadastrado no app e fica cifrado (DPAPI) na máquina
# dele. Os segredos daqui são os do FTP do site, e só os jobs Linux os veem.

name: Release Windows

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Ensaio: builda e testa o instalador, mas NÃO publica."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: false

env:
  DOWNLOADS_BASE_URL: https://thomsoft.com.br/downloads
  CHANNEL: codeck
  # Python embutido, por hash fixo: o .exe que o dev roda não pode levar um binário que mudou sem ninguém ver.
  PYTHON_EMBED_URL: https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip
  PYTHON_EMBED_SHA256: 4acbed6dd1c744b0376e3b1cf57ce906f9dc9e95e68824584c8099a63025a3c3

jobs:
  version:
    name: Versão
    runs-on: ubuntu-latest
    outputs:
      build_name: ${{ steps.ver.outputs.build_name }}
      build_number: ${{ steps.ver.outputs.build_number }}
      skip: ${{ steps.ver.outputs.skip }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Compute version
        id: ver
        run: |
          line="$(sed -nE 's/^([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)$/\1 \2/p' VERSION)"
          [ -n "$line" ] || { echo "::error::VERSION precisa ser x.y.z+N"; exit 1; }
          read -r BUILD_NAME BUILD_NUMBER <<< "$line"
          echo "build_name=$BUILD_NAME" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "### Codeck $BUILD_NAME (build $BUILD_NUMBER)" >> "$GITHUB_STEP_SUMMARY"
          # Push que mexeu no VERSION sem subir o build não gasta cota.
          got="$(curl -fsS "$DOWNLOADS_BASE_URL/$CHANNEL/latest.json?t=$(date +%s)" 2>/dev/null | jq -r '.windows.build // 0' 2>/dev/null || true)"
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "${got:-0}" -ge "$BUILD_NUMBER" ]; then
            echo "O build $BUILD_NUMBER já está publicado — nada a fazer." >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  # O kit do ThomSoft Setup, lido pelo FTP e entregue ao Windows como artefato (por HTTP o Cloudflare responde
  # 403 a runners do GitHub de vez em quando). O runner do Windows só confere o SHA-256.
  kit:
    name: Kit do ThomSoft Setup
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Certificado do servidor de FTP
        timeout-minutes: 3
        env:
          FTP_SERVER: ${{ secrets.DOWNLOADS_FTP_SERVER }}
        run: |
          set -euo pipefail
          CERT=$(mktemp)
          openssl s_client -starttls ftp -connect "$FTP_SERVER:21" \
            -CAfile /etc/ssl/certs/ca-certificates.crt \
            -verify_return_error -verify 5 </dev/null 2>/dev/null | openssl x509 > "$CERT"
          openssl x509 -in "$CERT" -noout -checkend 0
          openssl x509 -in "$CERT" -noout -ext subjectAltName | grep -q 'DNS:\*\.hstgr\.io'
      - name: Ler pelo FTP
        env:
          FTP_USERNAME: ${{ secrets.DOWNLOADS_FTP_USER }}
          LFTP_PASSWORD: ${{ secrets.DOWNLOADS_FTP_PASSWORD }}
          FTP_SERVER: ${{ secrets.DOWNLOADS_FTP_SERVER }}
          FTP_ROOT: ${{ vars.DOWNLOADS_FTP_ROOT || '/' }}
        run: |
          set -euo pipefail
          sudo apt-get install -y lftp >/dev/null
          mkdir kit
          lftp_run() {
            lftp -u "$FTP_USERNAME" --env-password "ftp://$FTP_SERVER" -e "
              set ssl:ca-file /etc/ssl/certs/ca-certificates.crt;
              set ftp:ssl-force true;
              set ftp:ssl-protect-data true;
              set ssl:verify-certificate true;
              set ssl:check-hostname false;
              set ftp:passive-mode true;
              set net:max-retries 3;
              set net:timeout 30;
              set cmd:fail-exit true;
              $1
              bye"
          }
          remote="${FTP_ROOT%/}/thomsoft-setup"
          lftp_run "cd $remote; lcd kit; get kit.json"
          zip="$(jq -r '.url' kit/kit.json | sed 's#.*/##')"
          case "$zip" in thomsoft-setup-kit-*.zip) ;; *) echo "::error::kit.json com URL inválida"; exit 1 ;; esac
          lftp_run "cd $remote; lcd kit; get $zip"
          mv "kit/$zip" kit/kit.zip
          got="$(sha256sum kit/kit.zip | cut -d' ' -f1)"
          [ "$got" = "$(jq -r '.sha256' kit/kit.json)" ] || { echo "::error::kit com hash inesperado ($got)"; exit 1; }
          echo "✓ ThomSoft Setup $(jq -r '.version' kit/kit.json)+$(jq -r '.build' kit/kit.json)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: thomsoft-setup-kit
          path: kit/
          retention-days: 1

  windows:
    name: Windows
    needs: [version, kit]
    if: needs.version.outputs.skip != 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      BUILD_NAME: ${{ needs.version.outputs.build_name }}
      BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Interface (Svelte → backend/static)
        working-directory: ui
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm ci falhou' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'build da interface falhou' }

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: thomsoft-setup-kit
          path: kit-download
      - name: Kit do ThomSoft Setup
        run: |
          $kitInfo = Get-Content kit-download/kit.json -Raw | ConvertFrom-Json
          Move-Item kit-download/kit.zip kit.zip
          $got = (Get-FileHash -Algorithm SHA256 kit.zip).Hash.ToLower()
          if ($got -ne $kitInfo.sha256) { throw "kit com hash inesperado ($got)" }
          Expand-Archive kit.zip -DestinationPath kit
          Write-Host "✓ ThomSoft Setup $($kitInfo.version)+$($kitInfo.build)"

      - name: App (C# + WebView2)
        run: |
          dotnet publish windows/Codeck/Codeck.csproj -c Release -o build/app `
            -p:Version=$env:BUILD_NAME -p:FileVersion="$env:BUILD_NAME.$env:BUILD_NUMBER" `
            --source https://api.nuget.org/v3/index.json
          if ($LASTEXITCODE -ne 0) { throw 'dotnet publish falhou' }
          Get-ChildItem build/app | Format-Table Name, Length

      - name: Python embutido + backend
        run: |
          Invoke-WebRequest -Uri $env:PYTHON_EMBED_URL -OutFile python.zip
          $got = (Get-FileHash -Algorithm SHA256 python.zip).Hash.ToLower()
          if ($got -ne $env:PYTHON_EMBED_SHA256) { throw "Python embutido com hash inesperado ($got)" }
          Expand-Archive python.zip -DestinationPath build/app/python
          New-Item -ItemType Directory -Force build/app/backend | Out-Null
          Copy-Item backend/server.py build/app/backend/
          Copy-Item -Recurse backend/pilot, backend/static build/app/backend/
          Get-ChildItem build/app/backend -Recurse -Directory -Filter __pycache__ | Remove-Item -Recurse -Force
          if (-not (Test-Path build/app/backend/static/index.html)) { throw 'interface não compilada' }
          # o backend sobe e responde com o Python embutido — com chave, como o app faz (sem ela a API não abre)
          $key = [guid]::NewGuid().ToString('N')
          $p = Start-Process build/app/python/python.exe -ArgumentList 'build/app/backend/server.py' -PassThru -NoNewWindow `
            -Environment @{ CODECK_PORT = '47899'; CODECK_DATA = "$env:RUNNER_TEMP\codeck-data"; CODECK_TOKEN = $key }
          $ok = $false
          for ($i = 0; $i -lt 30 -and -not $ok; $i++) {
            Start-Sleep -Seconds 1
            try { $ok = (Invoke-WebRequest http://127.0.0.1:47899/api/summary -Headers @{ 'X-Codeck-Token' = $key } -UseBasicParsing).StatusCode -eq 200 } catch { }
          }
          # e sem a chave recusa
          $denied = $false
          try { Invoke-WebRequest http://127.0.0.1:47899/api/summary -UseBasicParsing | Out-Null } catch { $denied = $_.Exception.Response.StatusCode.value__ -eq 401 }
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { throw 'o backend não respondeu com o Python embutido' }
          if (-not $denied) { throw 'o backend respondeu sem a chave da execução' }
          Write-Host '✓ backend responde com o Python embutido'
          # terminal de verdade (ConPTY via ctypes): abre um PowerShell, roda um comando e lê a saída
          $env:CODECK_DATA = "$env:RUNNER_TEMP\codeck-pty"
          @'
          import sys, time
          sys.path.insert(0, "build/app/backend")
          from pilot import terminals
          t = terminals.create(".", command="echo conpty-ok-$((6*7)); echo conpty-ok-42", cols=100, rows=30)
          seen = b""
          for _ in range(40):
              time.sleep(0.5)
              seen = bytes(t.scroll)
              if b"conpty-ok-42" in seen:
                  break
          t.resize(120, 40)
          t.write(b"exit\r")          # sair sozinho também tem de encerrar a leitura (sem travar)
          for _ in range(20):
              time.sleep(0.5)
              if t.exit is not None:
                  break
          print("encerrou sozinho:", t.exit is not None)
          t.kill()
          print(seen.decode("utf-8", "replace")[-400:])
          sys.exit(0 if b"conpty-ok-42" in seen else 1)
          '@ | Set-Content -Encoding utf8 pty-smoke.py
          build/app/python/python.exe pty-smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'o terminal (ConPTY) não respondeu' }
          Write-Host '✓ terminal ConPTY funciona com o Python embutido'

      - name: Runtime do Visual C++
        run: pwsh kit/tools/add-vc-runtime.ps1 -Bundle build/app -RedistOut build/redist

      # O app de desktop de verdade (Codeck.exe + WebView2) roda tests/desktop/selftest.js dentro da janela, com
      # teclas reais (Input.dispatchKeyEvent do WebView2): terminal ConPTY, editor, ⌘/Ctrl+S, tarefas em worktree,
      # revisão, quadro, janela própria… Falhou alguma etapa, o build para aqui.
      - name: Autoteste do app de desktop
        timeout-minutes: 15
        run: |
          $ErrorActionPreference = 'Stop'
          $w = Join-Path $env:RUNNER_TEMP 'selftest'
          $fx = Join-Path $w 'repos'; $out = Join-Path $w 'out'
          New-Item -ItemType Directory -Force $fx, $out | Out-Null
          git config --global user.email teste@codeck; git config --global user.name Teste; git config --global init.defaultBranch main
          git init -q --bare -b main "$fx/origin.git"
          git clone -q "$fx/origin.git" "$fx/demo-api" 2>$null
          Push-Location "$fx/demo-api"
          Set-Content a.txt "a" -NoNewline:$false
          Set-Content util.ts "export function soma(a: number, b: number): number {`n  return a + b;`n}"
          Set-Content main.ts "import { soma } from `"./util`";`n`nconst total: string = soma(1, 2);`nconsole.log(total);"
          Set-Content tsconfig.json '{"compilerOptions":{"strict":true,"target":"es2020","module":"commonjs"}}'
          # ignorados: o explorador mostra (apagados) — inclusive um repositório inteiro dentro deste (pasta "workspace")
          Set-Content .gitignore "workspace.local.json`n/nested-repo/`nbin/"
          Set-Content package.json '{"name":"demo","scripts":{"ola":"echo script-ok"}}'
          New-Item -ItemType Directory -Force .vscode | Out-Null
          Set-Content .vscode/launch.json "{`n  // comentário como no VS Code`n  `"version`": `"0.2.0`",`n  `"configurations`": [`n    { `"name`": `"Rodar demo`", `"type`": `"node-terminal`", `"request`": `"launch`", `"command`": `"echo launch-ok`" },`n  ],`n}"
          git add -A; git commit -qm inicial; git push -q -u origin main
          Set-Content workspace.local.json '{"segredo":"local"}'
          New-Item -ItemType Directory -Force bin | Out-Null; Set-Content bin/out.txt 'saida'
          # repositório aninhado (ignorado pelo de fora) com uma solução .NET: Gerenciador de Soluções e explorador entram nele
          New-Item -ItemType Directory -Force nested-repo/App/bin/Debug | Out-Null
          Push-Location nested-repo; git init -q -b main
          Set-Content nested.txt 'aninhado'
          Set-Content App.sln "Microsoft Visual Studio Solution File, Format Version 12.00`nProject(`"{FAE04EC0-301F-11D3-BF4B-00C04F79EFBC}`") = `"App`", `"App\App.csproj`", `"{11111111-1111-1111-1111-111111111111}`"`nEndProject"
          Set-Content App/App.csproj "<Project Sdk=`"Microsoft.NET.Sdk`">`n  <PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net8.0</TargetFramework></PropertyGroup>`n</Project>"
          Set-Content App/Program.cs 'System.Console.WriteLine("oi");'
          Set-Content App/bin/Debug/App.dll 'x'
          Pop-Location
          Pop-Location
          git clone -q "$fx/origin.git" "$fx/demo-web" 2>$null
          # servidor de linguagem do TypeScript (só para o teste)
          $lsp = Join-Path $w 'lsp'; New-Item -ItemType Directory -Force $lsp | Out-Null
          Push-Location $lsp; npm init -y | Out-Null; npm i --silent typescript-language-server@4.3.3 typescript@5.6.3 | Out-Null; Pop-Location
          $ctx = @{ fixture = $fx; lsp = $true; trusted = $null; account = '' } | ConvertTo-Json -Compress
          $env:CODECK_PORT = '47861'
          $env:CODECK_DATA = Join-Path $w 'data'
          $env:CODECK_LSP_PATH = Join-Path $lsp 'node_modules\.bin'
          $env:CODECK_SELFTEST = (Resolve-Path tests/desktop/selftest.js).Path
          $env:CODECK_SELFTEST_OUT = $out
          $env:CODECK_SELFTEST_CTX = $ctx
          $p = Start-Process build/app/Codeck.exe -PassThru
          for ($i = 0; $i -lt 600 -and -not (Test-Path "$out/result.json"); $i++) { Start-Sleep 1; if ($p.HasExited) { break } }
          # o roteiro termina pedindo para sair: o app tem de sair sozinho e levar junto o backend e os terminais
          $quitOk = $p.WaitForExit(20000)
          Start-Sleep 2
          $left = @(Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -match 'sleep 4244' -or $_.Name -eq 'python.exe' -and $_.CommandLine -match 'server.py' })
          Get-Process Codeck, python -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $left | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          if (-not $quitOk) { throw 'o app não saiu sozinho ao fechar' }
          if ($left.Count) { throw "sobraram processos depois de sair: $($left | ForEach-Object { $_.Name + ' ' + $_.CommandLine })" }
          if (-not (Test-Path "$out/result.json")) { throw 'o autoteste não terminou' }
          @'
          import json, sys
          r = json.load(open(sys.argv[1], encoding="utf-8"))
          if "fatal" in r: print("erro ao injetar:", r["fatal"]); sys.exit(1)
          for x in r["results"]:
              print(("OK " if x["ok"] else "FALHOU ") + x["name"] + (" — " + x["detail"] if x["detail"] else ""))
          print(f"{r['ok']}/{r['total']} etapas OK no Windows")
          for e in r["jsErrors"][:10]: print("erro JS:", e)
          sys.exit(0 if r["ok"] == r["total"] else 1)
          '@ | Set-Content -Encoding utf8 (Join-Path $w 'report.py')
          $env:PYTHONIOENCODING = 'utf-8'
          build/app/python/python.exe (Join-Path $w 'report.py') "$out/result.json"
          if ($LASTEXITCODE -ne 0) { throw 'autoteste do desktop falhou' }

      # Quem atualiza do Commitdeck (ou do PR Pilot) chega aqui com os dados no nome antigo: o app novo adota a pasta
      # (contas, regras, histórico), a do WebView2 e o "Iniciar com o Windows".
      - name: Migração do nome antigo (Commitdeck → Codeck)
        run: |
          $run = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          if (-not (Test-Path $run)) { New-Item -Path $run -Force | Out-Null }   # a imagem do runner pode vir sem a chave
          foreach ($r in $env:APPDATA, $env:LOCALAPPDATA) { Remove-Item -Recurse -Force (Join-Path $r 'Codeck') -ErrorAction SilentlyContinue }
          $old = Join-Path $env:APPDATA 'Commitdeck'
          New-Item -ItemType Directory -Force $old | Out-Null
          Set-Content (Join-Path $old 'marcador.txt') 'dados do Commitdeck'
          New-Item -ItemType Directory -Force (Join-Path $env:LOCALAPPDATA 'Commitdeck\WebView2') | Out-Null
          Set-ItemProperty $run -Name commitdeck -Value '"C:\antigo\Commitdeck.exe"'
          $env:CODECK_PORT = '47862'
          $p = Start-Process build/app/Codeck.exe -PassThru
          Start-Sleep 12
          Get-Process Codeck, python -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          if (-not (Test-Path (Join-Path $env:APPDATA 'Codeck\marcador.txt'))) { throw 'a pasta de dados do Commitdeck não foi adotada' }
          if (Test-Path $old) { throw 'a pasta antiga continuou lá' }
          if (-not (Test-Path (Join-Path $env:LOCALAPPDATA 'Codeck\WebView2'))) { throw 'a pasta do WebView2 não foi adotada' }
          $k = Get-ItemProperty $run
          if ($k.commitdeck) { throw 'o "Iniciar com o Windows" antigo ficou' }
          if (-not $k.codeck) { throw 'o "Iniciar com o Windows" não passou para o Codeck' }
          Remove-ItemProperty $run -Name codeck
          Write-Host "✓ dados, WebView2 e iniciar com o Windows adotados do Commitdeck"

      - name: Screenshots do autoteste
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: autoteste-windows
          path: ${{ runner.temp }}/selftest/out
          if-no-files-found: ignore

      # O ThomSoft Setup é um .exe genérico com o ícone do LuriSystem gravado: sem trocar, a janela e a barra de
      # tarefas do instalador (e o desinstalador) mostram a marca errada. O kit só troca o ícone do .exe de fora.
      - name: Ícone do Codeck no ThomSoft Setup
        run: |
          $rc = Join-Path $env:RUNNER_TEMP 'rcedit-x64.exe'
          Invoke-WebRequest -Uri 'https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe' -OutFile $rc
          $got = (Get-FileHash -Algorithm SHA256 $rc).Hash.ToLower()
          if ($got -ne '3e7801db1a5edbec91b49a24a094aad776cb4515488ea5a4ca2289c400eade2a') { throw "rcedit com hash inesperado ($got)" }
          & $rc kit/setup/setup.exe --set-icon windows/Codeck/app.ico --set-version-string FileDescription 'Instalador do Codeck' `
            --set-version-string ProductName 'Codeck'
          if ($LASTEXITCODE -ne 0) { throw 'rcedit falhou' }

      - name: Instalador (montar e executar)
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $manifest = [ordered]@{
            productId = 'codeck'
            productName = 'Codeck'
            publisher = 'ThomSoft'
            version = $env:BUILD_NAME
            build = [int]$env:BUILD_NUMBER
            exeName = 'Codeck.exe'
            brand = @{ primaryDark = '#3f95f2'; primaryLight = '#1d5fc2' }
            updateUrl = "$env:DOWNLOADS_BASE_URL/$env:CHANNEL/latest.json"
            replaces = @('commitdeck', 'pr-pilot')   # nomes antigos: o instalador desinstala o app antigo antes
          }
          $manifest | ConvertTo-Json -Depth 4 | Out-File -Encoding utf8 build/setup.json
          $out = "dist/Codeck-$env:BUILD_NAME-$env:BUILD_NUMBER-setup.exe"
          pwsh kit/tools/package-installer.ps1 `
            -Setup kit/setup -App build/app -Redist build/redist -Manifest build/setup.json -Ops kit/ops/setup-ops.ps1 `
            -Logo brand/logo.svg -Icon windows/Codeck/app.ico -Out $out
          if ($LASTEXITCODE -ne 0) { throw 'pacote' }
          pwsh kit/tools/smoke-installer.ps1 -Installer $out -Manifest build/setup.json
          if ($LASTEXITCODE -ne 0) { throw 'o instalador não passou no teste' }

      - name: Logs (se falhou)
        if: failure()
        run: |
          Get-ChildItem $env:TEMP -Filter '*-setup.log' | ForEach-Object { "== $($_.Name)"; Get-Content $_.FullName -Tail 80 }
          $log = Join-Path $env:APPDATA 'Codeck\codeck.log'
          if (Test-Path $log) { "== codeck.log"; Get-Content $log -Tail 80 }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: codeck-windows
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publicar (site da ThomSoft + GitHub Releases)
    needs: [version, windows]
    if: ${{ github.ref == 'refs/heads/main' && !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      BUILD_NAME: ${{ needs.version.outputs.build_name }}
      BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: codeck-windows
          path: dist

      - name: Credenciais do site configuradas?
        id: ftp
        env:
          SERVER: ${{ secrets.DOWNLOADS_FTP_SERVER }}
        run: |
          if [ -z "$SERVER" ]; then
            echo "::warning title=Site não configurado::Defina DOWNLOADS_FTP_SERVER, DOWNLOADS_FTP_USER e DOWNLOADS_FTP_PASSWORD. O instalador está nos artefatos desta execução."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Certificado do servidor de FTP
        if: steps.ftp.outputs.ready == 'true'
        timeout-minutes: 3
        env:
          FTP_SERVER: ${{ secrets.DOWNLOADS_FTP_SERVER }}
        run: |
          set -euo pipefail
          CERT=$(mktemp)
          openssl s_client -starttls ftp -connect "$FTP_SERVER:21" \
            -CAfile /etc/ssl/certs/ca-certificates.crt \
            -verify_return_error -verify 5 </dev/null 2>/dev/null | openssl x509 > "$CERT"
          openssl x509 -in "$CERT" -noout -checkend 0
          openssl x509 -in "$CERT" -noout -ext subjectAltName | grep -q 'DNS:\*\.hstgr\.io'

      # O app baixa do GitHub Releases: o site da ThomSoft (Hostinger) corta conexões por volta de 4 MB, e o instalador
      # tem ~100 MB. O site fica como espelho (`mirrors` no latest.json) e é de onde a página do Codeck baixa, por partes.
      # O .exe sobe aqui ANTES do latest.json — com o nome de cada canal (as pontes só aceitam o próprio prefixo).
      - name: GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$BUILD_NAME-$BUILD_NUMBER"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "Codeck $BUILD_NAME (build $BUILD_NUMBER)" \
            --notes "$(git log -1 --format=%B)" --target "$GITHUB_SHA"
          exe="Codeck-$BUILD_NAME-$BUILD_NUMBER-setup.exe"
          for prefix in Commitdeck PR-Pilot; do cp "dist/$exe" "dist/$prefix-$BUILD_NAME-$BUILD_NUMBER-setup.exe"; done
          gh release upload "$tag" dist/*-"$BUILD_NAME-$BUILD_NUMBER"-setup.exe --clobber

      # O instalador primeiro, o latest.json por último: o app nunca vê um canal apontando para um instalador que
      # ainda está subindo. A parte do Mac (e o `required`) vêm do publicado, lido pelo FTP.
      - name: Enviar ao site
        if: steps.ftp.outputs.ready == 'true'
        timeout-minutes: 20
        env:
          FTP_USERNAME: ${{ secrets.DOWNLOADS_FTP_USER }}
          LFTP_PASSWORD: ${{ secrets.DOWNLOADS_FTP_PASSWORD }}
          FTP_SERVER: ${{ secrets.DOWNLOADS_FTP_SERVER }}
          FTP_ROOT: ${{ vars.DOWNLOADS_FTP_ROOT || '/' }}
          COMMIT_MSG: ${{ github.event.head_commit.message || 'Nova versão do Codeck.' }}
          SIGNING_KEY: ${{ secrets.CODECK_SIGNING_KEY }}
          RELEASES: https://github.com/${{ github.repository }}/releases/download
        run: |
          set -euo pipefail
          [ -n "$SIGNING_KEY" ] || { echo "::error::Falta o segredo CODECK_SIGNING_KEY (chave que assina o latest.json)"; exit 1; }
          sudo apt-get install -y lftp >/dev/null
          # latest.json assinado (ECDSA P-256; a pública está em backend/pilot/update.py): grava <arquivo>.sig
          sign_json() {
            local key; key="$(mktemp)"; chmod 600 "$key"
            printf '%s' "$SIGNING_KEY" | base64 -d > "$key"
            openssl dgst -sha256 -sign "$key" "$1" | base64 -w0 > "$1.sig"
            rm -f "$key"
          }
          lftp_run() {
            lftp -u "$FTP_USERNAME" --env-password "ftp://$FTP_SERVER" -e "
              set ssl:ca-file /etc/ssl/certs/ca-certificates.crt;
              set ftp:ssl-force true;
              set ftp:ssl-protect-data true;
              set ssl:verify-certificate true;
              set ssl:check-hostname false;
              set ftp:passive-mode true;
              set net:max-retries 3;
              set net:timeout 30;
              set net:reconnect-interval-base 5;
              set cmd:fail-exit true;
              $1
              bye"
          }
          exe="Codeck-$BUILD_NAME-$BUILD_NUMBER-setup.exe"
          remote="${FTP_ROOT%/}/$CHANNEL"
          lftp_run "mkdir -p -f $remote"
          tmp="$(mktemp -d)"
          # O .exe sobe ANTES de ler o latest.json: ler, ajustar e gravar ficam em sequência (segundos), e a parte do
          # Mac publicada pelo scripts/release-macos.sh nesse meio-tempo não é apagada.
          lftp_run "cd $remote; put dist/$exe;"
          if lftp_run "cd $remote; cls -1" | grep -qx 'latest.json'; then
            lftp_run "cd $remote; lcd $tmp; get latest.json -o current.json" \
              || { echo "::error::não li o latest.json publicado — nada foi enviado"; exit 1; }
            jq -e 'type == "object"' "$tmp/current.json" >/dev/null \
              || { echo "::error::o latest.json publicado não é JSON — nada foi enviado"; exit 1; }
          else
            echo '{}' > "$tmp/current.json"   # primeira publicação
          fi
          jq --arg url "$RELEASES/v$BUILD_NAME-$BUILD_NUMBER/$exe" --arg mirror "$DOWNLOADS_BASE_URL/$CHANNEL/$exe" \
             --arg sha "$(sha256sum "dist/$exe" | cut -d' ' -f1)" \
             --argjson size "$(stat -c %s "dist/$exe")" \
             --arg version "$BUILD_NAME" --argjson build "$BUILD_NUMBER" \
             --arg notes "$(printf '%s' "$COMMIT_MSG" | head -n 1)" \
             --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
             '.productId = "codeck"
              | .windows = {url: $url, mirrors: [$mirror], sha256: $sha, size: $size, version: $version, build: $build}
              | .notes = $notes | .publishedAt = $date
              | ([.windows, .macos] | map(select(. != null)) | max_by(.build)) as $n
              | .version = $n.version | .build = $n.build' "$tmp/current.json" > dist/latest.json
          cat dist/latest.json
          sign_json dist/latest.json
          lftp_run "cd $remote; put dist/latest.json; put dist/latest.json.sig;"
          old="$(lftp_run "cd $remote; cls -1" | sed -nE 's/^Codeck-[0-9.]+-([0-9]+)-setup\.exe$/\1/p' | sort -un | head -n -2)"
          for b in $old; do lftp_run "cd $remote; glob -a rm -f Codeck-*-$b-setup.exe;" || true; done
          code="$(curl -sS -o "$tmp/served.json" -w '%{http_code}' "$DOWNLOADS_BASE_URL/$CHANNEL/latest.json?t=$(date +%s)" || true)"
          if [ "$code" = 403 ]; then
            echo "::warning::o site respondeu 403 ao runner — confira $DOWNLOADS_BASE_URL/$CHANNEL/latest.json de fora"
          else
            got="$(jq -r .windows.build "$tmp/served.json")"
            [ "$got" = "$BUILD_NUMBER" ] || { echo "::error::o site ainda serve o build $got"; exit 1; }
          fi
          echo "- [latest.json]($DOWNLOADS_BASE_URL/$CHANNEL/latest.json): build $BUILD_NUMBER no ar" >> "$GITHUB_STEP_SUMMARY"
          # Pontes para quem ainda tem o app com um nome antigo: cada um lê o latest.json do próprio canal e só aceita
          # instalador com o próprio prefixo. O mesmo .exe vai para lá com esse nome; ele instala o Codeck, desinstala
          # o antigo (replaces) e o app adota a pasta de dados antiga.
          for pair in commitdeck:Commitdeck pr-pilot:PR-Pilot; do
            ch="${pair%%:*}" prefix="${pair#*:}"
            legacy="${FTP_ROOT%/}/$ch"
            lexe="$prefix-$BUILD_NAME-$BUILD_NUMBER-setup.exe"
            cp "dist/$exe" "$tmp/$lexe"
            lftp_run "mkdir -p -f $legacy; cd $legacy; lcd $tmp; put $lexe;"
            rm -f "$tmp/legacy-current.json"
            if lftp_run "cd $legacy; cls -1" | grep -qx 'latest.json'; then
              lftp_run "cd $legacy; lcd $tmp; get latest.json -o legacy-current.json" || { echo "::error::não li o latest.json de $ch"; exit 1; }
            else
              echo '{}' > "$tmp/legacy-current.json"
            fi
            jq --arg url "$RELEASES/v$BUILD_NAME-$BUILD_NUMBER/$lexe" --arg mirror "$DOWNLOADS_BASE_URL/$ch/$lexe" \
               --arg sha "$(sha256sum "$tmp/$lexe" | cut -d' ' -f1)" \
               --argjson size "$(stat -c %s "$tmp/$lexe")" \
               --arg version "$BUILD_NAME" --argjson build "$BUILD_NUMBER" \
               --arg pid "$ch" \
               --arg notes "Agora se chama Codeck. $(printf '%s' "$COMMIT_MSG" | head -n 1)" \
               --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
               '.productId = $pid
                | .windows = {url: $url, mirrors: [$mirror], sha256: $sha, size: $size, version: $version, build: $build}
                | .notes = $notes | .publishedAt = $date
                | ([.windows, .macos] | map(select(. != null)) | max_by(.build)) as $n
                | .version = $n.version | .build = $n.build' "$tmp/legacy-current.json" > "$tmp/legacy-latest.json"
            sign_json "$tmp/legacy-latest.json"
            lftp_run "cd $legacy; lcd $tmp; put legacy-latest.json -o latest.json; put legacy-latest.json.sig -o latest.json.sig;"
            old="$(lftp_run "cd $legacy; cls -1" | sed -nE "s/^$prefix-[0-9.]+-([0-9]+)-setup\.exe$/\1/p" | sort -un | head -n -2)"
            for b in $old; do lftp_run "cd $legacy; glob -a rm -f $prefix-*-$b-setup.exe;" || true; done
            echo "- ponte no canal antigo: $DOWNLOADS_BASE_URL/$ch/latest.json" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: latest.json no GitHub Releases
        if: steps.ftp.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v$BUILD_NAME-$BUILD_NUMBER" dist/latest.json --clobber
