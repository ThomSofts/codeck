# Testes dos bancos de dados no Windows — o mesmo pacote que se roda à mão (testar-bancos.ps1), num Windows de verdade:
#   1. o testar-bancos.ps1 no Windows PowerShell 5.1, com o Python embutido do Codeck (o mesmo do instalador, por hash);
#   2. o runner contra o PostgreSQL e o MongoDB que já vêm instalados no runner (o Windows do GitHub não roda
#      containers Linux, então o Docker fica de fora).
# Os relatórios ficam nos artefatos da execução e no resumo.
name: test-db-windows

on:
  push:
    paths: [db/**, backend/**, tests/db/**, scripts/windows/testar-bancos.ps1, .github/workflows/test-db-windows.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-db-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_EMBED_URL: https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip
  PYTHON_EMBED_SHA256: 4acbed6dd1c744b0376e3b1cf57ce906f9dc9e95e68824584c8099a63025a3c3
  GOTOOLCHAIN: auto

jobs:
  bancos:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Python embutido do Codeck (o mesmo do instalador)
        shell: pwsh
        run: |
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\Codeck\python'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Invoke-WebRequest -Uri $env:PYTHON_EMBED_URL -OutFile python.zip
          $got = (Get-FileHash -Algorithm SHA256 python.zip).Hash.ToLower()
          if ($got -ne $env:PYTHON_EMBED_SHA256) { throw "Python embutido com hash inesperado: $got" }
          Expand-Archive python.zip -DestinationPath $dir
          & (Join-Path $dir 'python.exe') -c "import sys, sqlite3; print(sys.version, sqlite3.sqlite_version)"

      - name: Pacote (como o preparar-teste-windows.sh monta) e plugins .exe
        shell: pwsh
        run: |
          $pkg = Join-Path $env:RUNNER_TEMP 'codeck-teste-windows'
          New-Item -ItemType Directory -Force "$pkg\backend", "$pkg\tests\db", "$pkg\plugins" | Out-Null
          Copy-Item backend\server.py, backend\mcp_db.py "$pkg\backend\"
          Copy-Item -Recurse backend\pilot "$pkg\backend\pilot"
          Copy-Item tests\db\run_tests.py "$pkg\tests\db\"
          Copy-Item -Recurse tests\db\fixtures "$pkg\tests\db\fixtures"
          Copy-Item scripts\windows\testar-bancos.ps1 $pkg
          Push-Location db
          go version
          foreach ($b in Get-ChildItem cmd -Directory) {
            $env:CGO_ENABLED = '0'
            go build -trimpath -o "$pkg\plugins\codeck-db-$($b.Name).exe" "./cmd/$($b.Name)"
            if ($LASTEXITCODE) { throw "plugin $($b.Name) não compilou" }
          }
          Pop-Location
          Get-ChildItem "$pkg\plugins"
          "PKG=$pkg" >> $env:GITHUB_ENV

      - name: testar-bancos.ps1 (Windows PowerShell 5.1, como no seu PC)
        shell: powershell
        run: |
          cd $env:PKG
          powershell -ExecutionPolicy Bypass -File testar-bancos.ps1 -SemDocker
          $code = $LASTEXITCODE
          $rep = Join-Path ([Environment]::GetFolderPath('Desktop')) 'codeck-teste-bancos.txt'
          Copy-Item $rep (Join-Path $env:RUNNER_TEMP 'relatorio-ps1.txt')
          exit $code

      - name: PostgreSQL e MongoDB do runner
        if: always()
        shell: pwsh
        run: |
          foreach ($n in 'postgresql*', 'MongoDB') {
            $s = Get-Service -Name $n -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($s) { Set-Service -InputObject $s -StartupType Manual; Start-Service -InputObject $s; "$($s.Name): $((Get-Service $s.Name).Status)" }
          }
          Start-Sleep 5

      - name: Bancos reais (PostgreSQL e MongoDB)
        if: always()
        shell: powershell
        run: |
          $targets = @{
            postgres = @{ engine = 'postgres'; env = @{ host = '127.0.0.1'; port = 5432; database = 'postgres'; user = 'postgres'; password = 'root'; tls = @{ mode = 'off'; offAck = $true } } }
            mongodb  = @{ engine = 'mongodb';  env = @{ host = '127.0.0.1'; port = 27017; database = 'loja'; tls = @{ mode = 'off'; offAck = $true } } }
          }
          $f = Join-Path $env:RUNNER_TEMP 'alvos.json'
          [IO.File]::WriteAllText($f, ($targets | ConvertTo-Json -Depth 6), (New-Object Text.UTF8Encoding($false)))
          $py = Join-Path $env:LOCALAPPDATA 'Programs\Codeck\python\python.exe'
          $env:PYTHONIOENCODING = 'utf-8'
          & $py -I "$env:PKG\tests\db\run_tests.py" --plugins "$env:PKG\plugins" --targets $f --only banco_ --report (Join-Path $env:RUNNER_TEMP 'relatorio-bancos.txt')
          exit $LASTEXITCODE

      - name: Relatórios
        if: always()
        shell: pwsh
        run: |
          foreach ($r in 'relatorio-ps1.txt', 'relatorio-bancos.txt') {
            $p = Join-Path $env:RUNNER_TEMP $r
            if (Test-Path $p) { "### $r`n``````" >> $env:GITHUB_STEP_SUMMARY; Get-Content $p -Encoding utf8 >> $env:GITHUB_STEP_SUMMARY; "``````" >> $env:GITHUB_STEP_SUMMARY }
          }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: relatorios-bancos-windows
          path: ${{ runner.temp }}/relatorio-*.txt
