<!doctype html>
<!-- Tela de abertura do Codeck (macOS e Windows): aparece enquanto o servidor local sobe. Uma página só, sem nada de
     fora (abre sem rede). O app nativo troca o texto de estado pela mensagem de erro, quando há — aí a animação
     acalma e o texto fica em destaque. Os cartões chegam em leque, o grafo desenha o "C" (commit → branch → merge) e
     depois tudo fica "respirando" até o app carregar. -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark light">
<title>Codeck</title>
<style>
  :root {
    --bg: #07080d; --bg2: #0d0f1a; --text: #eef0ff; --muted: #8b90a8; --line: rgba(255,255,255,.085);
    --a1: #6d4af0; --a2: #2f8cf0; --a3: #22c38e; --glow: rgba(109, 74, 240, .75); --card: #ffffff; --ink1: #5b34e8; --ink2: #2e7eea;
    --ease: cubic-bezier(.22, 1, .36, 1); --spring: cubic-bezier(.34, 1.56, .64, 1);
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f5f6fb; --bg2: #e9ebf7; --text: #12131c; --muted: #6a6f86; --line: rgba(20,20,60,.06); --glow: rgba(109, 74, 240, .28); }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; user-select: none; cursor: default; }

  /* ---------- fundo: aurora que deriva devagar + grade em perspectiva + grão */
  .sky { position: fixed; inset: -20%; filter: blur(70px) saturate(1.25); opacity: .9; }
  .blob { position: absolute; border-radius: 50%; mix-blend-mode: screen; opacity: 0; animation: blob-in 1.6s var(--ease) forwards, drift 18s ease-in-out infinite alternate; }
  .b1 { width: 46vmax; height: 46vmax; left: 18%; top: 14%; background: radial-gradient(circle, var(--a1), transparent 65%); animation-delay: 0s, 0s; }
  .b2 { width: 40vmax; height: 40vmax; right: 12%; top: 26%; background: radial-gradient(circle, var(--a2), transparent 65%); animation-delay: .15s, -6s; }
  .b3 { width: 30vmax; height: 30vmax; left: 40%; bottom: 6%; background: radial-gradient(circle, var(--a3), transparent 65%); animation-delay: .3s, -11s; }
  @media (prefers-color-scheme: light) { .blob { mix-blend-mode: multiply; } .sky { opacity: .35; } }
  @keyframes blob-in { to { opacity: .55; } }
  @keyframes drift { 0% { transform: translate(0, 0) scale(1); } 50% { transform: translate(4vmax, -3vmax) scale(1.12); } 100% { transform: translate(-3vmax, 2vmax) scale(.94); } }

  .grid { position: fixed; left: -50%; right: -50%; bottom: -10%; height: 60%; transform: perspective(600px) rotateX(62deg); transform-origin: bottom;
    background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 56px 56px; -webkit-mask-image: linear-gradient(to top, #000 0%, transparent 85%); mask-image: linear-gradient(to top, #000 0%, transparent 85%);
    animation: grid-run 6s linear infinite, fade-in 1.4s .2s var(--ease) both; }
  @keyframes grid-run { to { background-position: 0 56px, 0 0; } }
  .grain { position: fixed; inset: 0; opacity: .06; pointer-events: none; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  .vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 45%, var(--bg) 100%); opacity: .8; }

  /* ---------- palco */
  .stage { position: relative; height: 100%; display: grid; place-content: center; justify-items: center; gap: 26px; padding: 24px; }
  .mark { position: relative; width: 200px; height: 200px; animation: float 6s 2.2s ease-in-out infinite; }
  .halo { position: absolute; inset: -40%; border-radius: 50%; background: radial-gradient(circle, var(--glow), transparent 60%);
    opacity: 0; filter: blur(8px); animation: halo-in 1.2s .9s var(--ease) forwards, breathe 4s 2.1s ease-in-out infinite; }
  @keyframes halo-in { to { opacity: 1; } }
  /* anel de luz girando atrás do deck */
  .orbit { position: absolute; inset: -18%; border-radius: 50%; opacity: 0; filter: blur(22px);
    background: conic-gradient(from 0deg, transparent 0 15%, var(--a1) 30%, transparent 45% 60%, var(--a2) 75%, var(--a3) 85%, transparent 95%);
    -webkit-mask: radial-gradient(circle, transparent 38%, #000 52%, transparent 70%); mask: radial-gradient(circle, transparent 38%, #000 52%, transparent 70%);
    animation: halo-in 1.4s 1.2s var(--ease) forwards, spin 9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes breathe { 50% { transform: scale(1.08); opacity: .65; } }
  @keyframes float { 50% { transform: translateY(-6px); } }
  svg.logo { position: relative; width: 100%; height: 100%; overflow: visible; }

  /* cartões: chegam de baixo, girando, e abrem em leque */
  .card { transform-box: view-box; transform-origin: 256px 540px; opacity: 0; }
  .c2 { animation: deal2 .9s .05s var(--spring) forwards; }
  .c1 { animation: deal1 .9s .15s var(--spring) forwards; }
  .c0 { animation: deal0 .9s .25s var(--spring) forwards; }
  @keyframes deal2 { from { opacity: 0; transform: translate(0, 60px) rotate(-14deg) scale(.86); } to { opacity: .32; transform: translate(6px, -6px) rotate(12deg); } }
  @keyframes deal1 { from { opacity: 0; transform: translate(0, 60px) rotate(-10deg) scale(.86); } to { opacity: .58; transform: translate(3px, -3px) rotate(6deg); } }
  @keyframes deal0 { from { opacity: 0; transform: translate(0, 60px) rotate(-6deg) scale(.86); } to { opacity: 1; transform: none; } }
  /* depois, o leque "respira" */
  .fan .c2 { animation: deal2 .9s .05s var(--spring) forwards, fan2 5s 2.2s ease-in-out infinite; }
  .fan .c1 { animation: deal1 .9s .15s var(--spring) forwards, fan1 5s 2.2s ease-in-out infinite; }
  @keyframes fan2 { 0%, 100% { opacity: .32; transform: translate(6px, -6px) rotate(12deg); } 50% { opacity: .38; transform: translate(9px, -8px) rotate(15deg); } }
  @keyframes fan1 { 0%, 100% { opacity: .58; transform: translate(3px, -3px) rotate(6deg); } 50% { opacity: .64; transform: translate(4px, -4px) rotate(7.5deg); } }

  /* o grafo: a branch desenha o "C" saindo do commit; uma luz percorre o caminho; o merge estoura no fim */
  .branch { fill: none; stroke: url(#ink); stroke-width: 40; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1;
    animation: draw .85s .75s var(--ease) forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .commit { transform-box: fill-box; transform-origin: center; transform: scale(0); animation: pop .5s .6s var(--spring) forwards; }
  .merge { transform-box: fill-box; transform-origin: center; transform: scale(0); animation: pop .55s 1.5s var(--spring) forwards; }
  @keyframes pop { to { transform: scale(1); } }
  .spark { offset-path: path("M312.64 340.5 A92 92 0 1 1 312.64 195.5"); offset-rotate: 0deg; opacity: 0;
    animation: travel .85s .75s var(--ease) forwards, spark-out .3s 1.55s ease forwards; filter: drop-shadow(0 0 6px #fff) drop-shadow(0 0 14px var(--a2)); }
  @keyframes travel { from { offset-distance: 0%; opacity: 1; } to { offset-distance: 100%; opacity: 1; } }
  @keyframes spark-out { to { opacity: 0; } }
  .ripple { fill: none; stroke: var(--a3); stroke-width: 3; transform-box: fill-box; transform-origin: center; opacity: 0; }
  .r1 { animation: ripple 1.1s 1.55s var(--ease) forwards, ripple 2.4s 3.2s var(--ease) infinite; }
  .r2 { animation: ripple 1.1s 1.75s var(--ease) forwards, ripple 2.4s 3.6s var(--ease) infinite; }
  @keyframes ripple { from { opacity: .9; transform: scale(.6); } to { opacity: 0; transform: scale(2.4); } }
  /* brilho que passa pelo cartão da frente de vez em quando */
  .sheen { transform: translateX(-420px) skewX(-18deg); animation: sheen 5.5s 1.9s var(--ease) infinite; }
  @keyframes sheen { 0% { transform: translateX(-420px) skewX(-18deg); } 30%, 100% { transform: translateX(520px) skewX(-18deg); } }

  /* ---------- nome, frase e estado */
  .word { display: flex; gap: .02em; margin: 0; font-size: 48px; font-weight: 700; letter-spacing: -.035em; line-height: 1; }
  .word span { display: inline-block; opacity: 0; filter: blur(10px); transform: translateY(16px);
    animation: letter .8s var(--ease) forwards; animation-delay: calc(.95s + var(--i) * 55ms);
    background: linear-gradient(180deg, var(--text) 30%, color-mix(in srgb, var(--text) 65%, var(--a2))); -webkit-background-clip: text; background-clip: text; color: transparent; }
  @keyframes letter { to { opacity: 1; filter: blur(0); transform: none; } }
  .tag { margin: -12px 0 0; color: var(--muted); font-size: 14px; letter-spacing: .01em; opacity: 0; animation: rise .8s 1.45s var(--ease) forwards; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .status { display: grid; justify-items: center; gap: 12px; min-height: 48px; opacity: 0; animation: rise .8s 1.7s var(--ease) forwards; }
  .bar { position: relative; width: 168px; height: 3px; border-radius: 3px; overflow: hidden; background: var(--line); }
  .bar i { position: absolute; inset: 0 auto 0 0; width: 40%; border-radius: 3px; background: linear-gradient(90deg, transparent, var(--a1), var(--a2), var(--a3), transparent);
    animation: scan 1.5s cubic-bezier(.65, 0, .35, 1) infinite; }
  @keyframes scan { from { transform: translateX(-110%); } to { transform: translateX(260%); } }
  .msg { max-width: 520px; margin: 0; text-align: center; font-size: 13px; color: var(--muted); letter-spacing: .02em;
    background: linear-gradient(90deg, var(--muted) 0%, var(--muted) 40%, var(--text) 50%, var(--muted) 60%, var(--muted) 100%); background-size: 250% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer 2.4s linear infinite; }
  @keyframes shimmer { from { background-position: 100% 0; } to { background-position: -150% 0; } }
  @keyframes fade-in { from { opacity: 0; } }

  /* erro: o app nativo trocou o texto — sem shimmer, sem barra, texto legível */
  .error .bar { display: none; }
  .error .msg { animation: none; color: var(--text); background: none; font-size: 14px; line-height: 1.5; letter-spacing: 0; user-select: text; white-space: pre-wrap; }
  .error .merge, .error .r1, .error .r2 { filter: grayscale(1); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; }
    .spark { display: none; }
  }
</style>
</head>
<body>
  <div class="sky" aria-hidden="true"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
  <div class="grid" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <main class="stage" id="stage">
    <div class="mark" aria-hidden="true">
      <div class="halo"></div><div class="orbit"></div>
      <svg class="logo fan" viewBox="0 0 512 512">
        <defs>
          <linearGradient id="ink" x1="150" y1="380" x2="360" y2="150" gradientUnits="userSpaceOnUse"><stop stop-color="#5b34e8"/><stop offset="1" stop-color="#2e7eea"/></linearGradient>
          <linearGradient id="face" x1="0" y1="92" x2="0" y2="444" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#eef1ff"/></linearGradient>
          <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
          <clipPath id="front"><rect x="106" y="92" width="300" height="352" rx="66"/></clipPath>
          <filter id="drop" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#1b0f6b" flood-opacity=".45"/></filter>
        </defs>
        <rect class="card c2" x="106" y="92" width="300" height="352" rx="66" fill="#c3cefb"/>
        <rect class="card c1" x="106" y="92" width="300" height="352" rx="66" fill="#8ea2f7"/>
        <g class="card c0" filter="url(#drop)">
          <rect x="106" y="92" width="300" height="352" rx="66" fill="url(#face)"/>
          <g clip-path="url(#front)"><rect class="sheen" x="40" y="60" width="90" height="420" fill="url(#shine)" opacity=".55"/></g>
        </g>
        <path class="branch" pathLength="1" d="M312.64 340.5 A92 92 0 1 1 312.64 195.5"/>
        <circle class="commit" cx="312.64" cy="340.5" r="31" fill="url(#ink)"/>
        <circle class="ripple r1" cx="312.64" cy="195.5" r="37"/>
        <circle class="ripple r2" cx="312.64" cy="195.5" r="37"/>
        <g class="merge"><circle cx="312.64" cy="195.5" r="37" fill="#1fbf88"/><circle cx="312.64" cy="195.5" r="14" fill="#fff"/></g>
        <circle class="spark" r="9" fill="#fff"/>
      </svg>
    </div>
    <h1 class="word" aria-label="Codeck"><span style="--i:0">C</span><span style="--i:1">o</span><span style="--i:2">d</span><span style="--i:3">e</span><span style="--i:4">c</span><span style="--i:5">k</span></h1>
    <p class="tag">Projetos, agentes de IA, Git e PRs num lugar só</p>
    <div class="status" role="status"><div class="bar"><i></i></div><p class="msg" id="msg">Iniciando…</p></div>
  </main>
  <script>
    // o app nativo troca o texto quando algo deu errado: a tela vira um aviso legível
    var m = document.getElementById("msg");
    if (m && m.textContent.trim() !== "Iniciando…") document.getElementById("stage").classList.add("error");
  </script>
</body>
</html>
